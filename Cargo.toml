[package]
name = "scrap-monitoring-lidar-generator"
version = "0.9.0"
edition = "2024"
rust-version = "1.96"
description = "Synthetic LiDAR configuration and wire contract foundation."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "scrap-monitoring-lidar-generator-rust"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
num-bigint = "=0.4.8"
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.6"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
