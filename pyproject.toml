[project]
name = "scrap-monitoring-lidar-generator"
version = "0.2.1"
description = "Synthetic LiDAR scan data generator for scrap monitoring development."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "msgpack>=1.2.2,<1.3",
    "numpy>=2.5.3,<2.6",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
scrap-monitoring-lidar-generator = "scrap_monitoring_lidar_generator.cli:main"

[build-system]
requires = ["uv_build==0.12.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0,<5",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6,<0.17",
    "rumdl>=0.2.70,<0.3",
    "types-jsonschema>=4.26.0.20260518,<5",
]
[tool.uv]
required-version = "==0.12.12"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.rumdl]
disable = ["MD013"]
exclude = ["docs/internal/**"]
respect-gitignore = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
