name: Edge candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ARM64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require main source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "edge candidates must be built from main" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Rust source
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Check third-party notices
        shell: bash
        run: |
          cargo install --locked --version 0.9.2 --features cli cargo-about
          python3 tools/generate_third_party_notices.py --check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.37.1
          driver-opts: |
            image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Build local ARM64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.rust-candidate
          platforms: linux/arm64
          load: true
          push: false
          tags: scrap-monitoring-lidar-simulator:edge-candidate-verify
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=candidate-${{ github.sha }}
          cache-to: type=gha,mode=max,scope=edge-candidate

      - name: Verify local candidate image
        run: |
          tests/edge/verify-rust-candidate-image.sh \
            scrap-monitoring-lidar-simulator:edge-candidate-verify \
            examples \
            "$GITHUB_SHA"

  publish:
    name: Publish ARM64 candidate
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.37.1
          driver-opts: |
            image=docker.io/moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate reference
        id: candidate
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision_ref="$image_name:rust-candidate-sha-$GITHUB_SHA"
          existing_digest=""
          publish=""
          inspect_stdout="$RUNNER_TEMP/candidate-inspect.out"
          inspect_stderr="$RUNNER_TEMP/candidate-inspect.err"
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "$revision_ref" \
              --format '{{.Manifest.Digest}}' \
              >"$inspect_stdout" 2>"$inspect_stderr"; then
              existing_digest="$(<"$inspect_stdout")"
              publish="false"
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 2))"
              continue
            fi
            inspect_error="$(<"$inspect_stderr")"
            if [[ "$inspect_error" == "ERROR: $revision_ref: not found" ]] \
              || grep -Fqi 'manifest unknown' "$inspect_stderr"; then
              publish="true"
              break
            fi
            cat "$inspect_stderr" >&2
            echo "candidate manifest inspection failed without an explicit not-found response" >&2
            exit 1
          done
          if [[ -z "$publish" ]]; then
            echo "candidate manifest inspection did not reach a decision" >&2
            exit 1
          fi
          {
            echo "image_name=$image_name"
            echo "revision_ref=$revision_ref"
            echo "existing_digest=$existing_digest"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish candidate
        if: steps.candidate.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.rust-candidate
          platforms: linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.revision_ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=edge-candidate

      - name: Resolve candidate digest
        id: digest
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.candidate.outputs.existing_digest }}
        run: |
          digest="$BUILT_DIGEST"
          if [[ -z "$digest" ]]; then
            digest="$EXISTING_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid candidate digest: $digest" >&2
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.candidate.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          REVISION_REF: ${{ steps.candidate.outputs.revision_ref }}
        run: |
          tagged_digest="$(
            docker buildx imagetools inspect "$REVISION_REF" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ "$tagged_digest" != "$IMAGE_DIGEST" ]]; then
            echo "candidate tag and selected image resolve to different manifests" >&2
            exit 1
          fi

          manifest_path="$RUNNER_TEMP/candidate-manifest.json"
          docker buildx imagetools inspect --raw "$REVISION_REF" > "$manifest_path"
          python3 - "$manifest_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)
          runnable_platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
              )
              for entry in manifest.get("manifests", ())
              if entry.get("platform", {}).get("os") != "unknown"
          }
          expected = {("linux", "arm64")}
          if runnable_platforms != expected:
              raise SystemExit(
                  f"candidate platforms must be {sorted(expected)}: "
                  f"observed {sorted(runnable_platforms)}"
              )
          PY

          package_name="${IMAGE_NAME##*/}"
          visibility=""
          for _ in 1 2 3 4 5; do
            visibility="$(
              gh api "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name" \
                --jq .visibility 2>/dev/null || true
            )"
            if [[ "$visibility" == "public" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$visibility" != "public" ]]; then
            echo "GHCR package visibility is not public: ${visibility:-unavailable}" >&2
            exit 1
          fi

          docker pull --platform linux/arm64 "$IMAGE_NAME@$IMAGE_DIGEST"
          published_revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$IMAGE_NAME@$IMAGE_DIGEST"
          )"
          if [[ "$published_revision" != "$GITHUB_SHA" ]]; then
            echo "candidate image source revision differs from the workflow SHA" >&2
            exit 1
          fi

          tests/edge/verify-rust-candidate-image.sh \
            "$IMAGE_NAME@$IMAGE_DIGEST" \
            examples \
            "$GITHUB_SHA"

          install -d dist
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > dist/edge-candidate-image.txt
          printf '%s\n' "$GITHUB_SHA" > dist/edge-candidate-source-sha.txt

      - name: Upload candidate reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-candidate-${{ github.sha }}
          path: |
            dist/edge-candidate-image.txt
            dist/edge-candidate-source-sha.txt
          if-no-files-found: error
          retention-days: 30
