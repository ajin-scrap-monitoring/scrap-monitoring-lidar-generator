name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.4"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Validate Markdown
        run: uv run --locked rumdl check .

      - name: Validate repository boundaries
        shell: bash
        run: |
          test -f .agents/AGENTS.md
          test -L AGENTS.md
          test "$(readlink AGENTS.md)" = ".agents/AGENTS.md"
          test -L GEMINI.md
          test "$(readlink GEMINI.md)" = ".agents/AGENTS.md"
          test -L .claude/CLAUDE.md
          test "$(readlink .claude/CLAUDE.md)" = "../.agents/AGENTS.md"
          test "$(git ls-files docs/internal)" = "docs/internal/README.md"

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Check Python types
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest

      - name: Verify generated LiDAR wire modules
        run: uv run --locked python -m tools.generate_lidar_wire --check

      - name: Check out pinned edge platform contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ajin-scrap-monitoring/ajin-edge-platform
          ref: 666ca6067a3bb86833b74140cb659049025d0dae
          path: .contract/ajin-edge-platform
          persist-credentials: false

      - name: Verify edge platform processing compatibility
        run: |
          uv run --locked python -m tools.verify_edge_platform_contract \
            --edge-platform-root .contract/ajin-edge-platform

      - name: Smoke test CLI
        run: |
          uv run --locked scrap-monitoring-lidar-generator --help
          uv run --locked scrap-monitoring-lidar-generator-export-processing-config --help

      - name: Build package
        run: uv build --no-sources

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ARM64 OCI image
        run: docker buildx build --platform linux/arm64 --output type=cacheonly .

      - name: Build OCI image
        run: docker build --tag scrap-monitoring-lidar-generator:ci .

      - name: Smoke test OCI image
        run: docker run --rm scrap-monitoring-lidar-generator:ci --help
