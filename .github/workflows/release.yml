name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.4"

      - name: Validate release target
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          package_version="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image_name=$image_name"
            echo "version=$package_version"
            echo "version_ref=$image_name:$package_version"
            echo "revision_ref=$image_name:sha-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Validate source
        run: |
          uv run --locked rumdl check .
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked mypy
          uv run --locked pytest

      - name: Build package
        run: uv build --no-sources

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish OCI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.version_ref }}
            ${{ steps.release.outputs.revision_ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Verify published OCI image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
          VERSION_REF: ${{ steps.release.outputs.version_ref }}
          REVISION_REF: ${{ steps.release.outputs.revision_ref }}
        run: |
          version_digest="$(
            docker buildx imagetools inspect "$VERSION_REF" \
              --format '{{.Manifest.Digest}}'
          )"
          revision_digest="$(
            docker buildx imagetools inspect "$REVISION_REF" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid version manifest digest: $version_digest" >&2
            exit 1
          fi
          if [[ "$version_digest" != "$revision_digest" ]]; then
            echo "version and revision tags resolve to different manifests" >&2
            exit 1
          fi

          manifest_path="$RUNNER_TEMP/release-manifest.json"
          docker buildx imagetools inspect --raw "$VERSION_REF" > "$manifest_path"
          python - "$manifest_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)
          runnable_platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
              )
              for entry in manifest.get("manifests", ())
              if entry.get("platform", {}).get("os") != "unknown"
          }
          expected = {("linux", "arm64")}
          if runnable_platforms != expected:
              raise SystemExit(
                  f"release manifest platforms must be {sorted(expected)}: "
                  f"observed {sorted(runnable_platforms)}"
              )
          PY

          package_name="${IMAGE_NAME##*/}"
          visibility=""
          for attempt in 1 2 3 4 5; do
            visibility="$(
              gh api "/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name" \
                --jq .visibility 2>/dev/null || true
            )"
            if [[ "$visibility" == "public" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$visibility" != "public" ]]; then
            echo "GHCR package visibility is not public: ${visibility:-unavailable}" >&2
            exit 1
          fi
          printf '%s@%s\n' "$IMAGE_NAME" "$version_digest" > dist/oci-image.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
